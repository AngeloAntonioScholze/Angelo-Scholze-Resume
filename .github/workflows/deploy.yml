name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The committed lockfile is authored on Windows, and npm records only the
      # host platform's optional native binaries. Both `npm ci` and `npm install`
      # then honour it and leave a linux runner with no @rolldown/binding, so
      # vite build dies loading the native addon. Resolve fresh for this platform.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund

      # Surface the failing tail as an annotation; raw logs need repo admin.
      - name: Build react
        run: |
          set -o pipefail
          npm run build -w react 2>&1 | tee /tmp/react.log || {
            echo "::error title=react build failed::$(tail -n 25 /tmp/react.log | tr '\n' ' | ' | cut -c1-900)"
            exit 1
          }

      - name: Build vue
        run: |
          set -o pipefail
          npm run build -w vue 2>&1 | tee /tmp/vue.log || {
            echo "::error title=vue build failed::$(tail -n 25 /tmp/vue.log | tr '\n' ' | ' | cut -c1-900)"
            exit 1
          }

      - run: npm run assemble

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
